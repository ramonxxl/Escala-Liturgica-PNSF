appId: com.escalaliturgica.desktop
productName: EscalaLiturgica
electronVersion: 33.4.11
# Sem modulos nativos (sql.js e WASM), entao nao ha nada pra recompilar pro
# Electron — desativar evita que o electron-builder tente reinstalar
# dependencias de producao dentro de packages/desktop (o node_modules e
# hoisted pra raiz do monorepo, e essa reinstalacao falha em CI).
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: ramonxxl
  repo: Escala-Liturgica-PNSF
win:
  target: nsis
  artifactName: EscalaLiturgica_Setup_v${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
