appId: com.escalaliturgica.desktop
productName: EscalaLiturgica
electronVersion: 33.4.11
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: ramonxxl
  repo: Escala-Liturgica-PNSF
win:
  target: nsis
  artifactName: EscalaLiturgica_Setup_v${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
