appId: com.escalaliturgica.desktop
productName: EscalaLiturgica
electronVersion: 33.4.11
# Sem modulos nativos (sql.js e WASM), entao nao ha nada pra recompilar pro
# Electron — desativar evita que o electron-builder tente reinstalar
# dependencias de producao dentro de packages/desktop (o node_modules e
# hoisted pra raiz do monorepo, e essa reinstalacao falha em CI).
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: ramonxxl
  repo: Escala-Liturgica-PNSF
  # Por padrao o electron-builder cria o Release como rascunho (so visivel
  # pra voce, e o electron-updater dos usuarios nao enxerga rascunhos).
  # Publicando direto porque o pipeline ja roda os testes antes de chegar
  # aqui — nao ha uma etapa manual de revisao no meio do caminho.
  draft: false
win:
  target: nsis
  artifactName: EscalaLiturgica_Setup_v${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
